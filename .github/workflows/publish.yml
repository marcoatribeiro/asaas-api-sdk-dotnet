# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Packages
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    # Restore packages dependencies
    - name: Install dependencies
      run: dotnet restore

    # Build packages
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Run the tests
    - name: Test
      run: dotnet test --configuration Release --no-build

  Deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ Build ]
    permissions:
      contents: read
      id-token: write # Lets NuGet/login request a GitHub OIDC token (Trusted Publishing)
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
  
      # Restore packages dependencies
      - name: Install dependencies
        run: dotnet restore

      # Build packages
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Publish packages
      - name: Publish package
        run: dotnet pack --configuration Release --no-build --no-restore

      # Trusted Publishing: swap the OIDC token for a nuget.org API key that lasts 1 hour.
      # Keep this step right before the push. The policy is set up on nuget.org under
      # Trusted Publishing (owner: marcoatribeiro, repo: asaas-api-sdk-dotnet, workflow: publish.yml).
      # https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: maurelio79 # nuget.org profile name (not the email)

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
